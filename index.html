<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ウマスカウト | AI競馬予想</title>
<meta name="description" content="Claudeが毎週土日の朝に中央競馬全レースを予想。馬連主軸の買い目を公開。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1013">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1013; --panel:#17181d; --panel2:#1d1f26; --line:#2a2c35;
  --text:#e9e7e2; --sub:#8f929e; --accent:#e6432e; --gold:#d9b45b;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:60px;
}
.wrap{max-width:640px;margin:0 auto}

/* ── header ── */
header{padding:20px 16px 0 16px}
.headtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.headlinks{display:flex;gap:6px;flex-shrink:0}
.ipat,.live{
  display:inline-flex;align-items:center;gap:4px;
  border:1px solid #3f4250;background:var(--panel);color:var(--text);
  padding:7px 11px;border-radius:4px;font-size:12px;font-weight:700;
  text-decoration:none;letter-spacing:.03em;white-space:nowrap;
}
.ipat span{font-size:10px;color:var(--sub)}
.ipat:active,.live:active{background:var(--panel2)}
.live{border-color:#5a3a38}
.live i{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  display:inline-block;animation:blink 1.6s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:26px;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.brand h1 .u{color:var(--accent)}
.brand .en{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.3em;color:var(--sub);text-transform:uppercase}
.dateline{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.dates{display:flex;gap:8px}
.datebtn{
  border:1px solid var(--line);background:var(--panel);color:var(--sub);
  padding:5px 14px;border-radius:3px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:inherit;
}
.datebtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.datebtn .dow{font-size:11px;margin-left:2px}
.dow.sat{color:#4d8fd6}.dow.sun{color:var(--accent)}
.datebtn.on .dow.sat{color:#1d5fa6}.datebtn.on .dow.sun{color:#c22}
.updated{font-size:11px;color:var(--sub);text-align:right;line-height:1.4}

/* ── venue tabs ── */
nav{
  position:sticky;top:0;z-index:10;background:var(--bg);
  border-bottom:1px solid var(--line);margin-top:16px;
}
.tabs{display:flex;max-width:640px;margin:0 auto}
.tab{
  flex:1;text-align:center;padding:12px 0 10px;cursor:pointer;
  color:var(--sub);font-weight:700;font-size:15px;letter-spacing:.15em;
  border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;
}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}

/* ── race cards ── */
main{padding:14px 12px}
details.race{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  margin-bottom:10px;overflow:hidden;
}
details.race[open]{border-color:#3a3d49}
summary{
  list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
summary::-webkit-details-marker{display:none}
.rno{
  font-family:Oswald,sans-serif;font-size:17px;font-weight:600;color:var(--text);
  min-width:38px;text-align:center;border-right:1px solid var(--line);padding-right:8px;
}
.rmeta{flex:1;min-width:0}
.rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:11px;color:var(--sub)}
.rpick{text-align:right;min-width:0}
.rpick .m{color:var(--accent);font-size:12px}
.rpick .n{font-size:12px;font-weight:700;white-space:nowrap}
.conf{
  font-family:Oswald,sans-serif;font-size:13px;font-weight:600;
  width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.conf.S{background:var(--accent);color:#fff}
.conf.A{background:#b06a2c;color:#fff}
.conf.B{background:#3a4256;color:#cfd4e0}
.conf.C{background:#4a3a56;color:#d8cfe0}
.body{border-top:1px solid var(--line);padding:12px 14px 14px}

/* marks */
.mk{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed #24262e}
.mk:last-child{border-bottom:none}
.mk .mark{width:20px;font-size:16px;text-align:center;flex-shrink:0}
.mk .mark.hon{color:var(--accent);font-weight:900}
.mk .mark.taikou{color:var(--text)}
.mk .mark.tan{color:var(--gold)}
.mk .mark.osae{color:var(--sub)}
.num{
  font-family:Oswald,sans-serif;font-weight:600;font-size:13px;
  width:22px;height:22px;border-radius:2px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.w1{background:#f2f0eb;color:#111}
.w2{background:#26272c;color:#fff;box-shadow:inset 0 0 0 1px #4a4c55}
.w3{background:#d6402e;color:#fff}
.w4{background:#2b6fd6;color:#fff}
.w5{background:#e3c33a;color:#111}
.w6{background:#2f9e5f;color:#fff}
.w7{background:#e8842e;color:#fff}
.w8{background:#e078a0;color:#fff}
.mk .info{flex:1;min-width:0}
.mk .hname{font-weight:700;font-size:14px}
.mk .hcmt{font-size:11px;color:var(--sub);line-height:1.45}
.mk .odds{font-family:Oswald,sans-serif;font-size:12px;color:var(--sub);text-align:right;flex-shrink:0;line-height:1.3}
.mk .odds b{display:block;color:var(--text);font-size:13px;font-weight:600}

/* summary + bets */
.rsummary{
  font-size:12.5px;color:#c9c7c1;background:var(--panel2);
  border-left:3px solid var(--accent);padding:8px 10px;margin:12px 0;border-radius:0 4px 4px 0;
}
.bets{display:flex;flex-direction:column;gap:8px}
.bet{display:flex;gap:10px;align-items:flex-start}
.btype{
  flex-shrink:0;width:58px;text-align:center;font-size:11px;font-weight:700;
  padding:4px 0;border-radius:3px;background:var(--panel2);color:var(--sub);
  border:1px solid var(--line);margin-top:1px;
}
.btype .bpay{
  display:block;font-family:Oswald,sans-serif;font-size:10px;font-weight:600;
  color:var(--gold);letter-spacing:0;margin-top:1px;
}
.bpts{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.pt{
  font-family:Oswald,sans-serif;font-size:13px;font-weight:500;letter-spacing:.05em;
  background:var(--panel2);border:1px solid var(--line);
  padding:2px 8px;border-radius:3px;
}
.pt.pthit{
  background:var(--gold);border-color:var(--gold);color:#1a1710;font-weight:600;
  box-shadow:0 0 0 2px rgba(217,180,91,.25);
}

/* WIN5 */
.win5{
  margin:14px 12px 0;background:linear-gradient(135deg,#1c1a14,#17181d 60%);
  border:1px solid #3d3623;border-radius:6px;padding:12px 14px;
}
.win5 .w5head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.win5 .w5title{font-family:Oswald,sans-serif;font-size:16px;font-weight:600;letter-spacing:.15em;color:var(--gold)}
.win5 .w5pts{font-size:11px;color:var(--sub)}
.win5 .w5pts b{color:var(--text);font-family:Oswald,sans-serif;font-size:14px}
.w5leg{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #2e2a1e}
.w5leg:last-child{border-bottom:none}
.w5leg .lno{font-family:Oswald,sans-serif;font-size:11px;color:var(--gold);width:14px;flex-shrink:0}
.w5leg .lrace{font-size:12px;min-width:0;flex:1}
.w5leg .lrace b{font-size:12.5px}
.w5leg .lrace span{color:var(--sub);font-size:10.5px;display:block}
.w5leg .lpicks{display:flex;gap:4px;flex-shrink:0}

/* 当日の結果表示 */
.daysum{
  display:flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--sub);
}
.daysum b{color:var(--text);font-family:Oswald,sans-serif;font-size:15px;font-weight:600}
.daysum b.gold{color:var(--gold)}
.dsupd{margin-left:auto;font-size:10.5px;color:#5c5f6a}
.rres{
  flex-basis:100%;font-size:11px;color:var(--sub);line-height:1.4;
  margin-top:7px;padding-top:6px;border-top:1px dashed #24262e;
}
.rres.hit{color:var(--gold);font-weight:700}
details.race.hit{border-color:#5a3a38}
details.race.done .rname{color:#b8b6b0}
.rank{
  font-family:Oswald,sans-serif;font-size:10px;font-weight:600;
  padding:1px 5px;border-radius:2px;margin-left:6px;
}
.rank.r1{background:var(--gold);color:#1a1710}
.rank.r2{background:#3a4256;color:#dfe3ea}
.rank.r3{background:#2f3542;color:#b9bfcc}
.w5st{font-size:14px;font-weight:700;margin-left:5px;align-self:center}
.w5st.ok{color:var(--gold)}
.w5st.ng{color:#5c5f6a}

/* 成績 */
.restitle{font-weight:700;font-size:13px;color:var(--text);margin:18px 2px 8px;letter-spacing:.05em}
.restitle:first-child{margin-top:4px}
.tblwrap{overflow-x:auto}
.restbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
.restbl th,.restbl td{padding:8px 6px;text-align:center;border-bottom:1px solid #22242c}
.restbl th{color:var(--sub);font-weight:700;font-size:11px}
.restbl td b{color:var(--accent)}
.blue{color:#4da3ff;font-weight:700}
.resnote{font-size:10.5px;color:#5c5f6a;margin:6px 2px 0;line-height:1.6}
.resrace{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:8px}
.resrace.hit{border-color:#5a3a38}
.rr1{display:flex;justify-content:space-between;align-items:center}
.rrname{font-weight:700;font-size:13px}
.rr2{font-size:11.5px;color:var(--sub);margin-top:2px}
.rr3{font-size:12px;margin-top:3px;color:#5c5f6a}
.resrace.hit .rr3{color:var(--gold);font-weight:700}
.rrw5{font-family:Oswald,sans-serif;font-size:17px;font-weight:600;color:var(--sub)}
.rrw5 small{font-size:11px}
.rrw5.full{color:var(--gold)}

/* footer */
footer{padding:26px 16px 10px;text-align:center;color:#5c5f6a;font-size:10.5px;line-height:1.8}
.legend{
  display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
  color:#8f929e;font-size:11px;
}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i.conf{font-style:normal;width:18px;height:18px;font-size:11px;display:inline-flex}
.legend-top{justify-content:flex-start;padding:0 2px;margin-bottom:10px}
.loading{text-align:center;color:var(--sub);padding:60px 0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="headtop">
    <div class="brand">
      <h1>ウマスカウト<span class="u">◎</span></h1>
      <span class="en">AI Keiba Predictions</span>
    </div>
    <div class="headlinks">
      <a class="live" href="https://sp.gch.jp/jra" target="_blank" rel="noopener"><i></i>ライブ</a>
      <a class="ipat" href="https://www.ipat.jra.go.jp/sp/" target="_blank" rel="noopener">即PAT<span>↗</span></a>
    </div>
  </div>
  <div class="dateline">
    <div class="dates" id="dates"></div>
    <div class="updated" id="updated"></div>
  </div>
</header>
<div id="win5box"></div>
<nav><div class="tabs" id="tabs"></div></nav>
<main id="main"><div class="loading">読み込み中…</div></main>
<footer>
  本予想はAI(Claude)による参考情報であり、的中を保証するものではありません。<br>
  馬券の購入は自己責任で。20歳未満の方は馬券を購入できません。
</footer>
</div>
<script>
const $=s=>document.querySelector(s);
let DATA=null, venueIdx=0;
const DOW=["日","月","火","水","木","金","土"];

function fmtDate(d){
  const y=d.slice(0,4),m=+d.slice(4,6),dd=+d.slice(6,8);
  const dow=new Date(+y,m-1,dd).getDay();
  return {label:`${m}/${dd}`, dow:DOW[dow], cls:dow===0?"sun":dow===6?"sat":""};
}

function jstDate(offsetDays){
  const d=new Date(Date.now()+9*3600*1000+(offsetDays||0)*86400*1000);
  return d.toISOString().slice(0,10).replace(/-/g,"");
}

async function init(){
  try{
    const idx=await (await fetch("predictions/index.json",{cache:"no-store"})).json();
    const params=new URLSearchParams(location.search);
    const today=jstDate(0);
    const dow=new Date(Date.now()+9*3600*1000).getUTCDay();
    // 表示する日付ボタン: 週末は今週の土日(未公開日も含む)、平日は直近の公開分
    let buttons;
    if(dow===6) buttons=[today,jstDate(1)];
    else if(dow===0) buttons=[jstDate(-1),today];
    else buttons=idx.dates.slice(0,2).sort();
    let date=params.get("date")||(buttons.includes(today)?today:buttons[buttons.length-1]);
    if(!buttons.includes(date)&&!idx.dates.includes(date)) date=buttons[buttons.length-1];
    const db=$("#dates"); db.innerHTML="";
    buttons.forEach(d=>{
      const f=fmtDate(d);
      const b=document.createElement("button");
      b.className="datebtn"+(d===date&&venueIdx>=0?" on":"");
      b.innerHTML=`${f.label}<span class="dow ${f.cls}">${f.dow}</span>`;
      b.onclick=()=>{venueIdx=0;history.replaceState(null,"",`?date=${d}`);init();};
      db.appendChild(b);
    });
    const sb=document.createElement("button");
    sb.className="datebtn"+(venueIdx<0?" on":"");
    sb.textContent="成績";
    sb.onclick=()=>{venueIdx=-1;init();};
    db.appendChild(sb);
    if(venueIdx<0){
      document.querySelector("nav").style.display="none";
      $("#updated").textContent="";
      $("#win5box").innerHTML="";
      renderResults();
      return;
    }
    document.querySelector("nav").style.display="";
    if(!idx.dates.includes(date)){
      // まだ公開されていない日 (当日朝8時の自動更新で公開される)
      DATA=null;
      $("#updated").textContent="";
      $("#win5box").innerHTML="";
      renderTabs();
      const f=fmtDate(date);
      $("#main").innerHTML=`<div class="loading">${f.label}(${f.dow})の予想は、<br>当日の朝8時ごろに公開されます。<br><br>公開までしばらくお待ちください🐴</div>`;
      return;
    }
    DATA=await (await fetch(`predictions/${date}.json`,{cache:"no-store"})).json();
    await loadDayResults(date);
    $("#updated").textContent=`${DATA.updated} 更新`;
    renderWin5();
    renderTabs();
    render();
  }catch(e){
    $("#main").innerHTML=`<div class="loading">データを読み込めませんでした。<br>まだ今週の予想が生成されていない可能性があります。</div>`;
  }
}

// 当日の確定結果 (確定版 results/DATE.json、なければ途中経過 results/live.json)
let DAYRES=null, RESMAP={};
async function loadDayResults(date){
  DAYRES=null; RESMAP={};
  for(const url of [`results/${date}.json`,"results/live.json"]){
    try{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) continue;
      const j=await r.json();
      if(j.date!==date) continue;
      DAYRES=j;
      (j.races||[]).forEach(x=>RESMAP[x.race_id]=x);
      break;
    }catch(e){}
  }
}

function renderWin5(){
  const box=$("#win5box"); box.innerHTML="";
  const w=DATA.win5;
  if(!w) return;
  const w5res=(DAYRES&&DAYRES.win5)?DAYRES.win5:null;
  const wakuOf=(rid,num)=>{
    for(const v of DATA.venues) for(const r of v.races)
      if(r.race_id===rid){const h=(r.horses||[]).find(h=>h.num===num);return h?h.waku:1;}
    return 1;
  };
  const legs=w.races.map((l,i)=>{
    const st=w5res?w5res.legs[i]:null;
    const stHtml=(!st||st.pending)?"":(st.hit?'<span class="w5st ok">○</span>':'<span class="w5st ng">✕</span>');
    return `
    <div class="w5leg">
      <span class="lno">${i+1}</span>
      <div class="lrace"><b>${esc(l.venue)}${l.no}R ${esc(l.name)}</b><span>${esc(l.time)}発走 / 自信度${esc(l.confidence)}</span></div>
      <div class="lpicks">${l.picks.map(p=>`<span class="num w${wakuOf(l.race_id,p.num)}" title="${esc(p.name)}">${p.num}</span>`).join("")}${stHtml}</div>
    </div>`;}).join("");
  box.innerHTML=`<div class="win5">
    <div class="w5head"><span class="w5title">WIN5</span><span class="w5pts">フォーメーション <b>${w.points}</b> 点</span></div>
    ${legs}
  </div>`;
}

function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  if(DATA&&venueIdx>=DATA.venues.length) venueIdx=0;
  (DATA?DATA.venues:[]).forEach((v,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===venueIdx?" on":"");
    b.textContent=v.name;
    b.onclick=()=>{venueIdx=i;renderTabs();render();window.scrollTo({top:0});};
    t.appendChild(b);
  });
}

let RES=null;
async function loadResults(){
  if(RES) return RES;
  const idx=await (await fetch("results/index.json",{cache:"no-store"})).json();
  RES=[];
  for(const d of idx.dates){
    RES.push(await (await fetch(`results/${d}.json`,{cache:"no-store"})).json());
  }
  return RES;
}

const BETNAMES={tansho:"単勝",umaren:"馬連",sanrenpuku:"三連複",sanrentan:"三連単"};
const BETKEYS=["tansho","umaren","sanrenpuku","sanrentan"];

async function renderResults(){
  $("#win5box").style.display="none";
  const main=$("#main");
  main.innerHTML=`<div class="loading">結果を読み込み中…</div>`;
  let res;
  try{res=await loadResults();}
  catch(e){main.innerHTML=`<div class="loading">まだ結果データがありません。<br>レース終了後の集計をお待ちください。</div>`;return;}
  if(!res.length){main.innerHTML=`<div class="loading">まだ結果データがありません。</div>`;return;}

  // 自信度×券種 集計
  const agg={};
  ["S","A","B","C"].forEach(c=>{agg[c]={};BETKEYS.forEach(k=>agg[c][k]={hit:0,lose:0,cost:0,ret:0});});
  let raceCount=0;
  res.forEach(day=>day.races.forEach(r=>{
    raceCount++;
    BETKEYS.forEach(k=>{
      const b=r.bets[k];if(!b||!b.points)return;
      const c=agg[r.confidence]||agg.B;
      b.hit?c[k].hit++:c[k].lose++;
      c[k].cost+=b.points*100;
      c[k].ret+=b.payout;
    });
  }));

  let html=`<div class="restitle">自信度×券種の勝敗（全${raceCount}レース）</div>
  <div class="tblwrap"><table class="restbl"><tr><th></th>${BETKEYS.map(k=>`<th>${BETNAMES[k]}</th>`).join("")}</tr>`;
  ["S","A","B","C"].forEach(c=>{
    const row=BETKEYS.map(k=>{
      const a=agg[c][k];
      if(a.hit+a.lose===0) return "<td>-</td>";
      return `<td>${a.hit?`<b>${a.hit}勝</b>`:a.hit+"勝"}${a.lose}敗</td>`;
    }).join("");
    html+=`<tr><th><span class="conf ${c}" style="display:inline-flex">${c}</span></th>${row}</tr>`;
  });
  html+=`</table></div>`;

  // WIN5通算 (回収率表とWIN5セクションで使用)
  const w5days=res.filter(d=>d.win5);
  const w5cost=w5days.reduce((s,d)=>s+d.win5.points*100,0);
  const w5ret=w5days.reduce((s,d)=>s+(d.win5.payout||0),0);
  const w5pct=w5cost?Math.round(w5ret/w5cost*100):0;

  // 自信度を絞って買った場合の通算回収率
  const TIERS=[["Sのみ",["S"]],["S+A",["S","A"]],["S+A+B",["S","A","B"]],["すべて",["S","A","B","C"]]];
  html+=`<div class="restitle">通算回収率 — 自信度で絞って買った場合</div>
  <div class="tblwrap"><table class="restbl"><tr><th></th>${BETKEYS.map(k=>`<th>${BETNAMES[k]}</th>`).join("")}</tr>`;
  TIERS.forEach(([label,confs])=>{
    const row=BETKEYS.map(k=>{
      let cost=0,ret=0;
      confs.forEach(c=>{cost+=agg[c][k].cost;ret+=agg[c][k].ret;});
      if(!cost) return "<td>-</td>";
      const pct=Math.round(ret/cost*100);
      return `<td class="${ret>cost?"blue":""}">${pct}%</td>`;
    }).join("");
    html+=`<tr><th>${label}</th>${row}</tr>`;
  });
  if(w5days.length){
    html+=`<tr><th>WIN5</th><td colspan="4" class="${w5ret>w5cost?"blue":""}">${w5pct}%</td></tr>`;
  }
  html+=`</table></div>
  <p class="resnote">勝敗は「そのレースの買い目のどれかが的中したか」。回収率は該当する自信度のレースの買い目をすべて100円ずつ買った場合の通算。100%超えは青字。</p>`;

  // WIN5成績
  if(w5days.length){
    const wins=w5days.filter(d=>d.win5.hits===5).length;
    html+=`<div class="restitle">WIN5 — ${w5days.length}回挑戦 / ${wins}回的中</div>`;
    w5days.forEach(day=>{
      const w=day.win5;
      const f=fmtDate(day.date);
      html+=`<div class="resrace${w.hits===5?" hit":""}">
        <div class="rr1"><span class="rrname">${f.label}(${f.dow})　${w.points}点</span>
        <span class="rrw5 ${w.hits===5?"full":""}">${w.hits}<small>/5</small></span></div>
        <div class="rr2">${w.legs.map(l=>`${esc(l.venue)}${l.no}R${l.hit?"○":"✕"}`).join("　")}</div>
        <div class="rr3">${w.hits===5?"WIN5的中！🎯":`5レース中${w.hits}レース的中…不的中`}</div>
      </div>`;
    });
  }

  // 日別レース結果
  res.forEach(day=>{
    const f=fmtDate(day.date);
    const hits=day.races.filter(r=>BETKEYS.some(k=>r.bets[k]&&r.bets[k].hit)).length;
    html+=`<div class="restitle">${f.label}(${f.dow}) — 的中 ${hits}/${day.races.length}レース</div>`;
    day.races.forEach(r=>{
      const hitList=BETKEYS.filter(k=>r.bets[k]&&r.bets[k].hit)
        .map(k=>`${BETNAMES[k]}${r.bets[k].payout.toLocaleString()}円`);
      html+=`<div class="resrace${hitList.length?" hit":""}">
        <div class="rr1"><span class="rrname">${esc(r.venue)}${r.no}R ${esc(r.name)}</span>
        <span class="conf ${esc(r.confidence)}" style="width:20px;height:20px;font-size:11px">${esc(r.confidence)}</span></div>
        <div class="rr2">◎${r.honmei.num} ${esc(r.honmei.name)} ${r.honmei.win?"→ 1着🎯":""}　結果: ${r.top3.map(h=>h.num).join("→")}</div>
        <div class="rr3">${hitList.length?hitList.join(" / "):"不的中"}</div>
      </div>`;
    });
  });
  main.innerHTML=html;
}

const MARKCLS={"◎":"hon","◯":"taikou","○":"taikou","▲":"tan","△":"osae","☆":"tan"};
const CONFLABEL={"S":"鉄板","A":"有力","B":"混戦","C":"荒れ模様"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if(!DATA) return;
  if(venueIdx<0){renderResults();return;}
  $("#win5box").style.display="";
  const v=DATA.venues[venueIdx];
  const main=$("#main"); main.innerHTML="";
  main.insertAdjacentHTML("beforeend",`<div class="legend legend-top">
    自信度:
    <span><i class="conf S">S</i>鉄板</span>
    <span><i class="conf A">A</i>有力</span>
    <span><i class="conf B">B</i>混戦</span>
    <span><i class="conf C">C</i>荒れ模様</span>
  </div>`);
  // 当日の途中経過サマリー
  const doneRaces=Object.values(RESMAP);
  if(doneRaces.length){
    const hitN=doneRaces.filter(x=>BETKEYS.some(k=>x.bets[k]&&x.bets[k].hit)).length;
    main.insertAdjacentHTML("beforeend",`<div class="daysum">
      本日ここまで <b>${doneRaces.length}</b>R終了 / 的中 <b class="${hitN?"gold":""}">${hitN}</b>R
      ${DAYRES&&DAYRES.updated?`<span class="dsupd">${esc(DAYRES.updated)} 時点</span>`:""}
    </div>`);
  }
  v.races.forEach(r=>{
    const hmap={}; (r.horses||[]).forEach(h=>hmap[h.num]=h);
    const hon=(r.marks||[])[0];
    const res=RESMAP[r.race_id];
    const hitBets=res?BETKEYS.filter(k=>res.bets[k]&&res.bets[k].hit):[];
    const d=document.createElement("details");
    d.className="race"+(res?" done":"")+(hitBets.length?" hit":"");
    const marksHtml=(r.marks||[]).map(m=>{
      const h=hmap[m.num]||{};
      const oddsHtml=h.odds?`<div class="odds"><b>${h.odds}</b>${h.pop?h.pop+"人気":""}</div>`:"";
      const rank=res?res.top3.findIndex(x=>x.num===m.num):-1;
      const rankHtml=rank>=0?`<span class="rank r${rank+1}">${rank+1}着</span>`:"";
      return `<div class="mk">
        <span class="mark ${MARKCLS[m.mark]||"osae"}">${esc(m.mark)}</span>
        <span class="num w${h.waku||1}">${m.num}</span>
        <div class="info">
          <div class="hname">${esc(m.name)}${rankHtml}<span style="color:var(--sub);font-size:11px;font-weight:400"> ${esc(h.jockey||"")}</span></div>
          <div class="hcmt">${esc(m.comment||"")}</div>
        </div>${oddsHtml}</div>`;
    }).join("");
    const resLine=res?`<div class="rres${hitBets.length?" hit":""}">結果 ${res.top3.map(x=>x.num).join("→")} · ${
      hitBets.length?hitBets.map(k=>`${BETNAMES[k]}${res.bets[k].payout.toLocaleString()}円`).join(" / "):"不的中"}</div>`:"";
    const B=r.bets||{};
    const top=res?res.top3.map(x=>x.num):null;
    // 確定後、実際に当たった買い目だけを光らせる
    const isHit=(key,p)=>{
      if(!top||!res.bets[key]||!res.bets[key].hit) return false;
      const nums=(String(p).match(/\d+/g)||[]).map(Number);
      if(new Set(nums).size!==nums.length) return false;
      if(key==="tansho") return nums.length===1&&nums[0]===top[0];
      if(key==="umaren") return nums.length===2&&nums.every(n=>top.slice(0,2).includes(n));
      if(key==="sanrenpuku") return nums.length===3&&nums.every(n=>top.includes(n));
      if(key==="sanrentan") return nums.length===3&&nums.every((n,i)=>n===top[i]);
      return false;
    };
    const betRow=(label,key)=>{
      const pts=B[key]||[];
      if(!pts.length) return "";
      const paid=(res&&res.bets[key]&&res.bets[key].hit)?res.bets[key].payout:0;
      return `<div class="bet">
        <span class="btype">${label}${paid?`<span class="bpay">${paid.toLocaleString()}円</span>`:""}</span>
        <div class="bpts">${pts.map(p=>`<span class="pt${isHit(key,p)?" pthit":""}">${esc(p)}</span>`).join("")}</div>
      </div>`;
    };
    d.innerHTML=`
      <summary>
        <span class="rno">${r.no}R</span>
        <div class="rmeta">
          <div class="rname">${esc(r.name)}</div>
          <div class="rsub">${esc(r.time)} / ${esc(r.course)} / ${r.head}頭</div>
        </div>
        <div class="rpick"><span class="m">◎</span><span class="n">${esc(hon?hon.name:"")}</span></div>
        <span class="conf ${esc(r.confidence||"B")}">${esc(r.confidence||"B")}</span>
        ${resLine}
      </summary>
      <div class="body">
        ${marksHtml}
        <div class="rsummary">${esc(r.summary||"")}</div>
        <div class="bets">
          ${betRow("単勝","tansho")}
          ${betRow("馬連","umaren")}
          ${betRow("三連複","sanrenpuku")}
          ${betRow("三連単","sanrentan")}
        </div>
      </div>`;
    main.appendChild(d);
  });
}
init();
</script>
</body>
</html>
