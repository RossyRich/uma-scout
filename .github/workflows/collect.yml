name: collect

# 当日の中央競馬の出馬表を収集して data/ にコミットする。
# Claudeの予想タスク(土日8:00 JST)が git pull で受け取る。
#
# 【GitHubのcron遅延について】
# 実測でスケジュール時刻から常時3〜4時間遅れて発火する（最悪8時間超）。
# そのため cron は遅延を織り込んで大幅に前倒ししてある。それでも間に合わない
# 場合はClaude側が自力で収集するフォールバックが働くので、更新自体は落ちない。
#
# 【Claudeとの二重収集を避ける仕組み】
# Claudeが先に収集して push 済みなら、そのファイルは上書きしない（cp -n）。
# コミット処理は毎回リモート最新から作り直すので、競合で失敗することがない。
on:
  workflow_dispatch:
  schedule:
    # 17:00 UTC(金・土) = 翌02:00 JST(土・日)。遅延3〜4時間を見込んで朝5〜6時着を狙う。
    - cron: "0 17 * * 5,6"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: uma-scout-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 出馬表を収集
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          # Claudeが先に収集済みならスクレイプ自体を省く
          if [ -f "data/${DATE}.json" ]; then
            echo "収集済みのためスキップ: ${DATE}.json"
            exit 0
          fi
          echo "収集対象: $DATE"
          # 開催なしの日は終了コード1で落ちるだけなので握りつぶす
          python3 scrape.py "$DATE" || echo "(中央競馬の開催なし)"

      - name: 生成物を退避
        run: |
          mkdir -p staging
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          cp -f "data/${DATE}.json" staging/ 2>/dev/null || true
          ls -la staging/ 2>/dev/null || echo "(新規に収集したデータなし)"

      - name: コミットして push
        run: |
          git config user.name "uma-scout-bot"
          git config user.email "actions@users.noreply.github.com"

          # 毎回リモート最新の状態から作り直すので、Claudeのpushと衝突しない
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main

            # Claudeが既に置いたファイルは上書きしない（予想がそれを基に作られているため）
            mkdir -p data
            cp -n staging/*.json data/ 2>/dev/null || true

            # 古いデータを整理（直近6日分のみ保持）
            ls -1 data/*.json 2>/dev/null | sed 's/.*\///; s/\.json//' | sort -u | head -n -6 \
              | while read -r d; do rm -f "data/${d}.json"; done || true

            git add -A data/
            if git diff --cached --quiet; then
              echo "変更なし（Claudeが収集済み、または開催なし）"
              exit 0
            fi

            git commit -q -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d) 出馬表収集"
            if git push -q origin main; then
              echo "push成功"
              exit 0
            fi
            echo "リモートが進んでいたので作り直して再試行 ($i/5)"
            sleep $((i * 5))
          done
          echo "5回試行しても push できませんでした"
          exit 1
