name: collect

# 当日の中央競馬の出馬表を収集して data/ にコミットする。
# 土日の朝7時(JST)に走らせ、8時のClaude予想タスクが git pull で受け取る。
on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC(金・土) = 翌07:00 JST(土・日)
    - cron: "0 22 * * 5,6"

permissions:
  contents: write

concurrency:
  group: uma-scout-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 出馬表を収集
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "収集対象: $DATE"
          # 開催なしの日は終了コード1で落ちるだけなので握りつぶす
          python3 scrape.py "$DATE" || echo "(中央競馬の開催なし)"

      - name: 古いデータを整理（直近6日分のみ保持）
        run: |
          ls -1 data/*.json 2>/dev/null | sed 's/.*\///; s/\.json//' | sort -u | head -n -6 \
            | while read -r d; do echo "削除: $d"; rm -f "data/${d}.json"; done || true

      - name: コミットして push
        run: |
          git config user.name "uma-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d) 出馬表収集"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push失敗、リトライ $i"
            sleep 5
          done
          exit 1
