name: results

# 未集計の結果を集計して成績タブとWIN5の答え合わせを更新する。
# 毎日走らせるが、集計対象がなければ何もしない（平日は即終了）。
# AI判断を一切使わない純Python処理なので、Macが閉じていても必ず動く。
on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC = 18:00 JST（中央競馬の最終レース終了後）
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: uma-scout-write
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 未集計分を集計
        run: python3 results.py --auto

      - name: コミットして push
        run: |
          git config user.name "uma-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A results/
          if git diff --cached --quiet; then
            echo "集計対象なし"
            exit 0
          fi
          git commit -m "results: $(TZ=Asia/Tokyo date +%Y-%m-%d) 結果集計"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push失敗、リトライ $i"
            sleep 5
          done
          exit 1
